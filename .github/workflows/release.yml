name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK/libadwaita deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev desktop-file-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked --jobs 2 --target x86_64-unknown-linux-gnu

      - name: Package + checksums
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/cratey dist/cratey-x86_64-unknown-linux-gnu
          cd dist
          sha256sum cratey-x86_64-unknown-linux-gnu > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cratey-x86_64-unknown-linux-gnu
            dist/SHA256SUMS
          generate_release_notes: true